name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from src/version.h
        id: ver
        shell: pwsh
        run: |
          $h = Get-Content src/version.h -Raw
          if ($h -notmatch '#define\s+BLACKOUT_VERSION_STR\s+"([^"]+)"') {
            throw "BLACKOUT_VERSION_STR not found in src/version.h"
          }
          $v = $Matches[1]
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version.h says $v"

      # A tag that disagrees with the embedded version ships a binary whose
      # About box lies about which release it is. Fail loudly instead.
      - name: Tag must match version.h
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $ver = "${{ steps.ver.outputs.version }}"
          if ($tag -ne $ver) {
            throw "tag v$tag does not match src/version.h ($ver) - bump one of them"
          }
          Write-Host "tag and version.h agree on $ver"

      - name: Build
        shell: cmd
        run: build.bat

      - name: Unit self-test
        shell: pwsh
        run: |
          $p = Start-Process bin\Blackout.exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path bin\selftest.log) { Get-Content bin\selftest.log }
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          Remove-Item bin\selftest.log -ErrorAction SilentlyContinue

      # The end-to-end suite injects real keystrokes and reads screen pixels.
      # That is not reliable on an unattended runner, and a flaky red X trains
      # people to ignore CI. It runs on a real desktop instead.

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after choco install" }
          & $iscc installer\blackout.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $stage = "dist\portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item bin\Blackout.exe $stage
          Copy-Item LICENSE   "$stage\LICENSE.txt"
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\Blackout-$v-portable.zip" -Force
          Remove-Item $stage -Recurse -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackout-${{ steps.ver.outputs.version }}
          path: dist/*

  macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      # Includes the off-screen pixel-band render check, which needs no
      # Screen Recording permission. The keystroke-driven tools/e2e_test.sh
      # runs on a real desktop, for the same reason as on Windows.
      - name: Unit self-test
        run: bin/Blackout.app/Contents/MacOS/Blackout --selftest

      - name: Package zip
        id: zip
        run: |
          v=$(sed -n 's/^#define BLACKOUT_VERSION_STR "\(.*\)".*/\1/p' src/version.h | tr -d '\r')
          mkdir -p dist
          # ditto keeps the bundle's symlinks, permissions and signature intact
          ditto -c -k --keepParent bin/Blackout.app "dist/Blackout-$v-mac.zip"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackout-mac-${{ steps.zip.outputs.version }}
          path: dist/*

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # gh is preinstalled on the runner, so no third-party action is needed
      # here. One less thing to trust in a public repo's supply chain.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.windows.outputs.version }}"
          sed "s/{{VERSION}}/$v/g" installer/release-notes-template.md > release-notes.md
          gh release create "${{ github.ref_name }}" dist/* --title "Blackout $v" --notes-file release-notes.md
